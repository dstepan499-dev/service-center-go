services:
  postgres:
    image: postgres:16-alpine
    container_name: service-center-db
    restart: always
    environment:
      POSTGRES_DB: service_center_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./migrations/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

volumes:
  pgdata: